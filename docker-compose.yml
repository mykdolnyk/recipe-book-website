services:
  web:
    build: .
    env_file:
      - test.env
    volumes:
      # - ./app:/app
      - log_files:/var/log/
      - staticfiles:/app/staticfiles/
    expose:
      - 5000
    depends_on:
      - db
      - redis
    command: python -m gunicorn run:app --workers=3 --bind 0.0.0.0:5000

  nginx:
    build: 
      context: .
      dockerfile: nginx/dockerfile
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - log_files:/var/log/
      - staticfiles:/app/staticfiles/
    depends_on:
      - web
    ports:
      - "80:80"

  db:
    image: postgres:latest
    env_file:
      - test.env
    volumes:
      - db_data:/var/lib/postgresql
    restart: always
    expose: 
      - 5432

  redis:
    image: redis:latest
    expose:
      - 6379

  celery-worker:
    build: .
    env_file:
      - test.env
    volumes:
      - log_files:/var/log/
    depends_on:
      - web
    entrypoint: ""
    command: celery -A make_celery worker -l info

  celery-beat:
    build: .
    env_file:
      - test.env
    volumes:
      - log_files:/var/log/
    depends_on:
      - web
    entrypoint: ""
    command: celery -A make_celery beat -l info


volumes:
  log_files:
  staticfiles:
  db_data: