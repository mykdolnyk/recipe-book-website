services:
  web:
    build: .
    env_file:
      - test.env
    volumes:
      - log_files:/var/log/
      - staticfiles:/app/staticfiles/
    expose:
      - 5000
    command: python -m gunicorn run:app --workers=3 --bind 0.0.0.0:5000
  nginx:
    build: 
      context: .
      dockerfile: nginx/dockerfile
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - log_files:/var/log/
      - staticfiles:/app/staticfiles/
    ports:
      - "80:80"
  redis:
    image: redis:latest
    expose:
      - 6379
  celery-worker:
    build: .
    env_file:
      - test.env
    volumes:
      - log_files:/var/log/
    entrypoint: ""
    command: celery -A make_celery worker -l info
  celery-beat:
    build: .
    env_file:
      - test.env
    volumes:
      - log_files:/var/log/
    entrypoint: ""
    command: celery -A make_celery beat -l info

volumes:
  log_files:
  staticfiles: